name: Products Service CI/CD
on:
    push:
        paths:
            - "services/products-service/**"
        branches: [main]
jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: services/products-service
        steps:
            - name: Checkout code
              uses: actions/checkout@v2
            - name: Set up Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: "14"
            - name: Install dependencies
              run: npm install
            - name: Build project
              run: npm run build
            - name: Simulated deploy
              run: echo "Deploying products service..."
            - name: Auto version bump
              run: npm version patch --no-git-tag-version
            - name: Generate changelog
              run: git log --oneline -5 > CHANGELOG.md
